[package]
name = "rycos-dev-environment"
version = "0.1.0"
description = "RYCOS Dev Environment - desktop workspace with a native terminal connected to WSL 2"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "rycos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# ConPTY on Windows (the PTY layer used by WezTerm).
portable-pty = "0.9"
# Lightweight host metrics only; process + memory data, no disks/network/components.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
